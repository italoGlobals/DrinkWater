name: CI/CD Pipeline for React Native App

on:
  release:
    types: [created]
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-android:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('**/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Build and run Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: drinkwater-android-builder:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          build-args: |
            GITHUB_SHA=${{ github.sha }}
            NODE_ENV=production

      - name: Build Android APK
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/android:/app/android \
            drinkwater-android-builder:${{ github.sha }}

      - name: Clean up Docker images
        if: always()
        run: |
          docker rmi drinkwater-android-builder:${{ github.sha }} || true
          docker system prune -f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Update Docker cache
        if: always()
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
