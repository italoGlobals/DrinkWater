name: CI/CD Pipeline for React Native App

on:
  release:
    types: [created]
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-android:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Android APK
        run: |
          docker compose -f docker/docker-compose.yml up --build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: output/app-release.apk
          retention-days: 7
